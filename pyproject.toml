[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fall_agent"
version = "0.1.0"
description = "An evidence-seeking web research agent for CSE 571."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Angela Rose Marie Brauer" },
    { name = "Sumona Deb" },
    { name = "Ankit Gokhale" },
    { name = "Francisco Sanchez Garcia" }
]
dependencies = [
    "torch",
    "scikit-learn",
]

[project.optional-dependencies]
dev = [
    "build",
    "pytest",
    "pytest-cov",
    "ruff",
    "tox>=4.21.2",
]

[tool.setuptools]
py-modules = ["agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.tox]
requires = ["tox>=4.21.2"]
env_list = ["py", "ruff", "unit-tests"]

[tool.tox.env_run_base]
description = "Run the example tests against the installed package"
package = "wheel"
deps = ["pytest"]
commands = [
    ["python", "-m", "pytest", { replace = "posargs", default = ["tests"], extend = true }],
]

[tool.tox.env.ruff]
description = "Check lint and formatting"
skip_install = true
deps = ["ruff"]
commands = [
    ["ruff", "check", "agent.py", "src", "tests"],
    ["ruff", "format", "--check", "agent.py", "src", "tests"],
]

[tool.tox.env.format]
description = "Apply Ruff formatting"
skip_install = true
deps = ["ruff"]
commands = [["ruff", "format", "agent.py", "src", "tests"]]

[tool.tox.env.unit-tests]
description = "Run unit tests with coverage of the agent module"
deps = ["pytest", "pytest-cov"]
commands = [
    ["python", "-m", "pytest", "-s", "-v", "--cov=agent", "--cov-report=term", "--cov-report=html", "--cov-report=xml", { replace = "posargs", default = ["tests"], extend = true }],
]
